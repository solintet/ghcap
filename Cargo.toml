[package]
name = "ghcap"
version = "0.29.0"
edition = "2021"
rust-version = "1.89"
description = "Cross-platform GitHub workflow TUI"
license = "BSD-2-Clause"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.5.48", features = ["derive"] }
crossterm = "=0.29.0"
etcetera = "=0.10.0"
duct = "=0.13.7"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rustyline = "=15.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rust-i18n = "=4.2.2"
walkdir = "=2.5.0"
tempfile = "=3.23.0"


signal-hook = "=0.4.5"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["signal", "process", "fs", "term"] }
