name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --all-features --locked
      - name: Test
        run: cargo test --all-targets --all-features --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  linux-packages:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev debhelper build-essential rpm zstd curl podman
      - name: Build all Linux formats
        run: ./packaging/build-linux.sh
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ghcap-linux-packages
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.AppImage
            dist/*.rpm
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
          if-no-files-found: error
