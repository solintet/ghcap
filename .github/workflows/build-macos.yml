name: Build macOS

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Which macOS architecture to build
        required: true
        type: choice
        default: both
        options:
          - intel
          - apple-silicon
          - both

permissions:
  contents: read

jobs:
  build-intel:
    name: Build macOS Intel (x86_64)
    if: inputs.architecture == 'intel' || inputs.architecture == 'both'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Build and package Intel binary
        run: ./packaging/build-macos.sh intel
      - uses: actions/upload-artifact@v4
        with:
          name: ghcap-v0.0.29.7-macos-intel
          path: |
            dist/ghcap-v0.0.29.7-macos-intel.tar.gz
            dist/ghcap-v0.0.29.7-macos-intel.tar.gz.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  build-apple-silicon:
    name: Build macOS Apple Silicon (arm64)
    if: inputs.architecture == 'apple-silicon' || inputs.architecture == 'both'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Build and package Apple Silicon binary
        run: ./packaging/build-macos.sh apple-silicon
      - uses: actions/upload-artifact@v4
        with:
          name: ghcap-v0.0.29.7-macos-apple-silicon
          path: |
            dist/ghcap-v0.0.29.7-macos-apple-silicon.tar.gz
            dist/ghcap-v0.0.29.7-macos-apple-silicon.tar.gz.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
